name: Render CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: render blueprints validate render.yaml --workspace "$RENDER_WORKSPACE_ID" -o text
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ALLOWED_HOSTS: localhost
      SECRET_KEY: ci-insecure-secret-key
      RESEND_API_KEY: ci-fake-resend-key
      DATABASE_URL: postgres://cardcase:cardcase@localhost:5432/cardcase
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: cardcase
          POSTGRES_PASSWORD: cardcase
          POSTGRES_DB: cardcase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run python manage.py migrate
      - run: uv run gunicorn config.wsgi:application --bind 127.0.0.1:8000 --daemon
      - run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --retry 10 --retry-connrefused --retry-delay 1 \
            -H "Host: localhost" -H "X-Forwarded-Proto: https" \
            http://127.0.0.1:8000/health/)
          echo "GET /health/ -> $status"
          test "$status" = 200
