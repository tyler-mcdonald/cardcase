repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version. This can drift away from the installed
  # version in ./pyproject.toml. The alternative is a
  # more complex config here, so for now, opting to take
  # the minor risk of a ruff version mismatch.
  rev: v0.16.3
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    # Run the web frontend's own lint-staged config against staged web/ files.
    # This is the sole hook manager for the repo (see docs/precommit-monorepo-research.md) —
    # Husky was removed since git only supports one core.hooksPath.
    - id: web-lint-staged
      name: web lint-staged
      entry: pnpm --dir web exec lint-staged
      language: system
      files: ^web/
      pass_filenames: false
