[project]
name = "backend"
version = "0.1.0"
description = "Shared backend for cardcase"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3,<7.0",
    "django-allauth[headless]>=65.22.1",
    "django-anymail>=15.2,<16.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "django-environ>=0.14.0,<0.15.0",
    "django-filter>=26.2,<27.0",
    "django-health-check>=4.8.0,<5.0.0",
    "djangorestframework>=3.18.1,<4.0.0",
    "gunicorn>=27.0.1,<28.0.0",
    "psycopg[binary]>=3.3.9,<4.0.0",
    "whitenoise>=6.12.0,<6.13.0",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ", "allauth.*", "health_check.*", "anymail.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
addopts = "--ds=config.settings.test"
python_files = ["test_*.py", "*_test.py"]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2,<6.2.0",
    "djangorestframework-stubs>=3.18.2,<4.0.0",
    "mypy>=2.4.1,<3.0.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0,<5.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-django>=4.14.0,<5.0.0",
    "ruff>=0.17.5,<0.17.6",
    "time-machine>=3.6.0,<4.0.0",
    "types-django-filter>=26.2.0.20261107,<27.0.0.0",
]
