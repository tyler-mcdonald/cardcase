[project]
name = "backend"
version = "0.1.0"
description = "Shared backend for Card Case"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<7.0",
    "django-allauth[headless]>=65.19.1",
    "django-anymail>=15.1,<16.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "django-environ>=0.14.0,<0.15.0",
    "django-health-check>=4.5.0,<5.0.0",
    "gunicorn>=26.1.0,<27.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "whitenoise>=6.12.0,<6.13.0",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.client", "tests.conftest"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = ["environ", "allauth.*", "health_check.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "users.adapter"
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0,<6.2.0",
    "mypy>=2.3.1,<3.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-django>=4.14.0,<5.0.0",
    "ruff>=0.16.3,<0.16.4",
    "time-machine>=3.5.0,<4.0.0",
]
