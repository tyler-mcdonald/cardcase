projects:
  - name: cardcase
    environments:
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled # Prevent destructive actions by non-admins

        databases:
          - name: cardcase-db
            plan: free
            region: oregon
            ipAllowList: [] # Only allow internal connections
            postgresMajorVersion: "18"

        services:
          - type: web
            name: cardcase-backend
            runtime: python
            plan: free
            rootDir: backend
            buildCommand: pip install uv && unset VIRTUAL_ENV && uv sync --frozen --no-dev && uv run python manage.py collectstatic --noinput && uv run python manage.py migrate
            startCommand: unset VIRTUAL_ENV && uv run gunicorn config.wsgi:application
            envVars:
              - key: DJANGO_SETTINGS_MODULE
                value: config.settings.production
              - key: SECRET_KEY
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: cardcase-db
                  property: connectionString
              - key: DJANGO_ALLOWED_HOSTS
                value: api.cardcase.jtm-dev.com
