projects:
  - name: cardcase
    environments:
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled # Prevent destructive actions by non-admins

        databases:
          - name: cardcase-db
            plan: basic-256mb
            region: oregon
            ipAllowList: [] # Only allow internal connections
            postgresMajorVersion: "18"

        services:
          - type: web
            name: cardcase-backend
            runtime: python
            plan: free
            rootDir: backend
            autoDeployTrigger: checksPass
            buildCommand: >-
              pip install uv &&
              unset VIRTUAL_ENV &&
              uv sync --frozen --no-dev &&
              uv run python manage.py collectstatic --noinput &&
              uv run python manage.py migrate &&
              uv run python manage.py ensure_superuser
            startCommand: unset VIRTUAL_ENV && uv run gunicorn config.wsgi:application
            domains:
              - api.cardcase.app
            envVars:
              - key: DJANGO_SETTINGS_MODULE
                value: config.settings.production
              - key: SECRET_KEY
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: DJANGO_SUPERUSER_EMAIL
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: cardcase-db
                  property: connectionString
              - key: DJANGO_ALLOWED_HOSTS
                value: api.cardcase.app
              - key: FRONTEND_URL
                value: https://cardcase.app

          - type: web
            name: cardcase-web
            runtime: static
            rootDir: web
            autoDeployTrigger: checksPass
            buildCommand: pnpm install --frozen-lockfile && pnpm build
            staticPublishPath: dist
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            domains:
              - cardcase.app
            envVars:
              - key: VITE_API_URL
                value: https://api.cardcase.app
