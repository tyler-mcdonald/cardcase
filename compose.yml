services:
  db:
    image: postgres:18.6
    env_file: backend/.env.example
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardcase -d cardcase"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: backend/.env.example
    environment:
      DATABASE_URL: postgres://cardcase:cardcase@db:5432/cardcase
      FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')",
        ]
      interval: 2s
      timeout: 5s
      retries: 60

  web:
    build: ./web
    command: pnpm dev --host
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
