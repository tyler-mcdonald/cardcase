services:
  db:
    extends:
      file: backend/docker-compose.yml
      service: db
    ports: !reset []

  backend:
    build: ./backend
    command:
      - sh
      - -c
      - |
        until python -c "import socket; socket.create_connection(('db', 5432))" 2>/dev/null; do sleep 0.2; done && python manage.py migrate --skip-checks &
        exec python manage.py runserver --skip-checks 0.0.0.0:8000
    env_file: backend/.env.example
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_URL: http://${APP_HOST:-localhost}:${WEB_PORT:-3000}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')",
        ]
      interval: 1m
      start_period: 2m
      start_interval: 1s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    command: vite --host
    env_file:
      - path: web/.env.example
      - path: web/.env
        required: false
    environment:
      VITE_API_URL: http://${APP_HOST:-localhost}:${BACKEND_PORT:-8000}
    volumes:
      - ./web:/srv/app
      - /srv/app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 1m
      start_period: 1m
      start_interval: 1s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
